name = "netmcp-api"
main = "src/index.js"
compatibility_date = "2024-09-30"
compatibility_flags = ["nodejs_compat"]

# netmcp upstream + OAuth client (public client, PKCE)
[vars]
NETMCP_URL = "https://netmcp.hwmnbn.me/mcp"
NETMCP_TOKEN_URL = "https://netmcp.hwmnbn.me/token"
NETMCP_CLIENT_ID = "eWefWVrcVNgw04i0"
# Effective access-token lifetime in seconds. The server advertises 3600 but
# tokens were observed dying in ~1-2 min, so we cap low and refresh often.
NETMCP_TOKEN_TTL = "60"

# KV: stores the rotating refresh token + cached access token
[[kv_namespaces]]
binding = "NETMCP_AUTH"
id = "adb42c556a104d49b5d6861dc823732d"

# Custom domain — serves the Worker at https://netapi.hwmnbn.me
# (requires the hwmnbn.me zone to be in this Cloudflare account)
[[routes]]
pattern = "netapi.hwmnbn.me"
custom_domain = true

# Optional: Add secrets (for authentication)
# Run: wrangler secret put NETMCP_TOKEN --env production
# Then uncomment below:
# [env.production]
# [env.production.vars_and_secrets]
# secrets = ["NETMCP_TOKEN"]

# Optional: Add KV namespace for caching
# [env.production.kv_namespaces]
# KV_CACHE = "netmcp-cache-prod"

# Optional: Add Durable Objects
# [env.production]
# durable_objects.bindings = [
#   { name = "STATE", class_name = "RequestState" }
# ]

# Optional: Add D1 database
# [[d1_databases]]
# binding = "DB"
# database_name = "netmcp-db"
# database_id = "your-db-id"

# Limits
limits = { cpu_milliseconds = 50000 }

# Build configuration
[build]
command = "npm install"
cwd = "./"

# Routes (if using with Cloudflare Pages)
# [[routes]]
# pattern = "example.com/api/*"
# zone_id = "your-zone-id"
# custom_domain = true

# Optional: Triggers for scheduled tasks
# [triggers.crons]
# crons = ["0 0 * * *"]  # Daily at midnight

# Optional: Analytics Engine
# [[analytics_engine_datasets]]
# binding = "ANALYTICS"
